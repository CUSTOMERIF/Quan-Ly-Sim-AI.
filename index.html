<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#07182b">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="SIM AI Admin">
  <title>SIM AI Admin</title>

  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icons/icon-192.png">
  <link rel="apple-touch-icon" href="./icons/icon-192.png">

  <style>
    :root{
      --bg:#07111f;
      --panel:#0d2138;
      --line:rgba(255,255,255,.12);
      --text:#eef7ff;
      --muted:#9db0c4;
      --accent:#17c6b2;
    }
    *{box-sizing:border-box}
    html,body{margin:0;width:100%;height:100%;background:var(--bg);font-family:Arial,sans-serif;color:var(--text);overflow:hidden}
    #shell{height:100%;display:flex;flex-direction:column}
    #topbar{
      min-height:54px;padding:8px 10px;
      display:flex;align-items:center;gap:8px;
      background:linear-gradient(180deg,#0d2138,#081827);
      border-bottom:1px solid var(--line)
    }
    #brand{font-weight:800;white-space:nowrap}
    #status{font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
    button{
      border:0;border-radius:10px;padding:10px 12px;font-weight:800;
      color:#04211d;background:var(--accent);cursor:pointer
    }
    #reloadBtn{background:#dce8f4;color:#102030}
    #frameWrap{position:relative;flex:1;min-height:0}
    #appFrame{width:100%;height:100%;border:0;background:#fff;display:block}
    #loading{
      position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
      background:#07111f;color:#d8ebff;font-weight:700;z-index:3
    }
    #help{
      display:none;position:fixed;inset:0;background:rgba(0,0,0,.72);z-index:20;
      align-items:center;justify-content:center;padding:20px
    }
    #helpCard{
      max-width:440px;width:100%;background:#0d2138;border:1px solid var(--line);
      border-radius:18px;padding:18px;box-shadow:0 20px 60px rgba(0,0,0,.45)
    }
    #helpCard h3{margin:0 0 10px}
    #helpCard p{color:#c8d7e6;line-height:1.45}
    #helpCard button{width:100%}
    @media (max-width:700px){
      #topbar{min-height:50px;padding:6px}
      #brand{font-size:13px}
      #status{display:none}
      button{padding:9px 10px;font-size:12px}
    }
  </style>
</head>
<body>
  <div id="shell">
    <div id="topbar">
      <div id="brand">🔐 SIM AI ADMIN</div>
      <div id="status">Đang mở trang quản trị...</div>
      <button id="installBtn" type="button">⬇ Cài ứng dụng</button>
      <button id="reloadBtn" type="button">↻</button>
    </div>

    <div id="frameWrap">
      <div id="loading">Đang tải trang quản trị...</div>
      <iframe
        id="appFrame"
        title="SIM AI Admin"
        allow="clipboard-read; clipboard-write; fullscreen"
        allowfullscreen
        referrerpolicy="strict-origin-when-cross-origin"></iframe>
    </div>
  </div>

  <div id="help">
    <div id="helpCard">
      <h3>📲 Cài ứng dụng quản trị</h3>
      <p id="helpText"></p>
      <button type="button" id="closeHelp">Đóng</button>
    </div>
  </div>

  <script src="./config.js"></script>
  <script>
    (function(){
      const frame = document.getElementById('appFrame');
      const loading = document.getElementById('loading');
      const status = document.getElementById('status');
      const installBtn = document.getElementById('installBtn');
      const reloadBtn = document.getElementById('reloadBtn');
      const help = document.getElementById('help');
      const helpText = document.getElementById('helpText');
      const closeHelp = document.getElementById('closeHelp');

      function buildAdminUrl(){
        const base = String(window.ADMIN_PWA_CONFIG?.APP_BASE_URL || '').trim();
        if(!/^https:\/\/script\.google\.com\/macros\/s\/.+\/exec(?:\?.*)?$/i.test(base)){
          return '';
        }
        try{
          const url = new URL(base);
          url.searchParams.set('admin','1');
          return url.toString();
        }catch(e){
          return '';
        }
      }

      const adminUrl = buildAdminUrl();

      if(!adminUrl){
        loading.innerHTML =
          '⚠️ Chưa cài link Apps Script.<br><br>' +
          'Mở <b>config.js</b> và thay APP_BASE_URL bằng link <b>/exec</b>.';
        status.textContent = 'Chưa cấu hình link Apps Script';
      }else{
        frame.src = adminUrl;
        frame.addEventListener('load', ()=>{
          loading.style.display='none';
          status.textContent='Trang quản trị đã tải';
        });
      }

      reloadBtn.addEventListener('click', ()=>{
        if(adminUrl){
          loading.style.display='flex';
          frame.src = adminUrl + (adminUrl.includes('?') ? '&' : '?') + '_=' + Date.now();
        }
      });

      let deferredPrompt = null;

      function isStandalone(){
        return window.matchMedia('(display-mode: standalone)').matches ||
               window.navigator.standalone === true;
      }

      function refreshInstallButton(){
        if(isStandalone()) installBtn.style.display='none';
      }

      window.addEventListener('beforeinstallprompt', (e)=>{
        e.preventDefault();
        deferredPrompt=e;
        installBtn.style.display='inline-block';
      });

      installBtn.addEventListener('click', async ()=>{
        if(deferredPrompt){
          deferredPrompt.prompt();
          await deferredPrompt.userChoice;
          deferredPrompt=null;
          refreshInstallButton();
          return;
        }

        const isiOS = /iphone|ipad|ipod/i.test(navigator.userAgent);
        helpText.textContent = isiOS
          ? 'Trên iPhone/iPad: bấm nút Chia sẻ của Safari → chọn “Thêm vào Màn hình chính”.'
          : 'Nếu trình duyệt chưa hiện hộp cài đặt: mở menu ⋮ của Chrome → chọn “Cài đặt ứng dụng” hoặc “Thêm vào màn hình chính”.';
        help.style.display='flex';
      });

      closeHelp.addEventListener('click', ()=> help.style.display='none');
      help.addEventListener('click', e=>{ if(e.target===help) help.style.display='none'; });

      window.addEventListener('appinstalled', ()=>{
        deferredPrompt=null;
        refreshInstallButton();
      });

      if('serviceWorker' in navigator){
        window.addEventListener('load', ()=>{
          navigator.serviceWorker.register('./sw.js').catch(()=>{});
        });
      }

      refreshInstallButton();
    })();
  </script>
</body>
</html>
