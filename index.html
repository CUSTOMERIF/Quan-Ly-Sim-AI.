<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>QUẢN TRỊ TRA CỨU THÔNG TIN</title>
<!-- ADMIN • GitHub Wrapper V2 -->

<meta name="theme-color" content="#061426">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="QUẢN TRỊ TRA CỨU">
<meta name="application-name" content="QUẢN TRỊ TRA CỨU THÔNG TIN">

<link rel="preconnect" href="https://script.google.com" crossorigin>
<link rel="preconnect" href="https://script.googleusercontent.com" crossorigin>
<link rel="dns-prefetch" href="//script.google.com">
<link rel="dns-prefetch" href="//script.googleusercontent.com">
<link rel="manifest" href="manifest-admin.json">
<link rel="icon" type="image/png" sizes="192x192" href="admin-icon-192.png">
<link rel="apple-touch-icon" href="admin-icon-192.png">

<style>
:root{
  --bg:#031021;
  --bg2:#071b34;
  --panel:#071b31;
  --cyan:#38dcff;
  --blue:#2786ff;
  --violet:#6d5cff;
  --white:#eefaff;
  --muted:#8fb5d1;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:Inter,Arial,Helvetica,sans-serif;background:var(--bg)}
body{position:fixed;inset:0}

#adminFrame{
  position:fixed;inset:0;width:100%;height:100%;
  border:0;display:block;background:#071522;
  opacity:0;transform:scale(1.002);
  transition:opacity .34s ease,transform .34s ease;
}
body.app-ready #adminFrame{opacity:1;transform:scale(1)}

#loading{
  position:fixed;inset:0;z-index:20;overflow:hidden;
  display:flex;align-items:center;justify-content:center;
  background:
    radial-gradient(circle at 50% 22%,rgba(44,215,255,.18),transparent 24%),
    radial-gradient(circle at 18% 75%,rgba(88,82,255,.14),transparent 30%),
    linear-gradient(155deg,#020b17 0%,#06162b 48%,#071a32 100%);
  transition:opacity .18s ease,visibility .18s ease;
}
#loading.hide{opacity:0;visibility:hidden;pointer-events:none}

.grid-bg{
  position:absolute;inset:-20%;opacity:.11;transform:perspective(520px) rotateX(58deg) translateY(30%);
  transform-origin:center bottom;
  background-image:
    linear-gradient(rgba(54,211,255,.55) 1px,transparent 1px),
    linear-gradient(90deg,rgba(54,211,255,.55) 1px,transparent 1px);
  background-size:48px 48px;
  mask-image:linear-gradient(to bottom,transparent 0%,#000 24%,#000 78%,transparent 100%);
}

.glow-orb{position:absolute;border-radius:50%;filter:blur(54px);opacity:.22;pointer-events:none}
.o1{width:230px;height:230px;background:#00cfff;left:-85px;top:18%}
.o2{width:280px;height:280px;background:#4f46ff;right:-120px;bottom:8%}

.card{
  position:relative;z-index:5;width:min(91vw,410px);
  padding:25px 22px 22px;border-radius:24px;text-align:center;
  border:1px solid rgba(84,216,255,.22);
  background:linear-gradient(155deg,rgba(7,31,55,.84),rgba(4,18,34,.92));
  box-shadow:0 28px 80px rgba(0,0,0,.46),0 0 42px rgba(0,194,255,.07);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
}
.badge{
  display:inline-flex;align-items:center;gap:7px;
  padding:7px 12px;border-radius:999px;
  border:1px solid rgba(75,220,255,.24);
  background:rgba(22,110,160,.13);
  color:#a9eaff;font-size:11px;font-weight:850;letter-spacing:.45px;
}
.badge i{width:7px;height:7px;border-radius:50%;background:#41e2ff;box-shadow:0 0 13px #41e2ff}

.logo-wrap{
  position:relative;width:clamp(142px,41vw,190px);height:clamp(142px,41vw,190px);
  margin:18px auto 10px;display:grid;place-items:center;
}
.logo-ring{
  position:absolute;inset:4%;border-radius:50%;
  border:1px solid rgba(61,219,255,.2);
  box-shadow:0 0 30px rgba(23,185,255,.08);
  animation:spin 9s linear infinite;
}
.logo-ring:before,.logo-ring:after{
  content:"";position:absolute;width:8px;height:8px;border-radius:50%;
  background:#59e6ff;box-shadow:0 0 14px #59e6ff;
}
.logo-ring:before{left:8%;top:18%}
.logo-ring:after{right:3%;bottom:26%}
.logo{
  position:relative;width:100%;height:100%;object-fit:contain;
  display:block;filter:drop-shadow(0 14px 28px rgba(0,169,255,.30));
  animation:float 3.2s ease-in-out infinite;
}

h1{
  margin:5px 0 0;color:#f2fbff;
  font-size:clamp(21px,6.5vw,28px);line-height:1.14;font-weight:950;
  letter-spacing:.2px;
}
.admin-mark{
  margin-top:8px;color:#5ee5ff;font-size:12px;font-weight:850;
  letter-spacing:1.8px;text-transform:uppercase;
}
.sub{margin-top:9px;color:var(--muted);font-size:13px;line-height:1.5}

.progress{
  width:min(78vw,270px);height:7px;margin:19px auto 0;
  border-radius:99px;overflow:hidden;background:rgba(255,255,255,.075);
}
.bar{
  height:100%;width:12%;border-radius:inherit;
  background:linear-gradient(90deg,#00b9ef,#2d89ff,#785dff);
  box-shadow:0 0 16px rgba(54,202,255,.42);
  transition:width .24s ease;
}
.caption{margin-top:9px;color:#7ea8c4;font-size:11.5px}

.status-row{display:flex;justify-content:center;gap:7px;margin-top:14px}
.status-row i{
  width:6px;height:6px;border-radius:50%;background:#48dcff;
  animation:pulse 1.25s ease-in-out infinite
}
.status-row i:nth-child(2){animation-delay:.15s}
.status-row i:nth-child(3){animation-delay:.3s}

@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{0%,80%,100%{opacity:.28;transform:scale(.8)}40%{opacity:1;transform:scale(1.18)}}

body.net-lite .grid-bg{display:none}
body.net-lite .logo,body.net-lite .logo-ring{animation:none}
@media(max-height:650px){
  .card{padding:16px 18px}
  .logo-wrap{width:112px;height:112px;margin:10px auto 6px}
  .progress{margin-top:12px}
}
@media(prefers-reduced-motion:reduce){
  *,*:before,*:after{animation:none!important;transition:none!important}
}
</style>
</head>
<body>

<iframe
  id="adminFrame"
  src="https://script.google.com/macros/s/AKfycbxQdyFPkxNCmIfu5y1tEajdBF6y58I1qlUgBxaMTklnNYIwXfnTZbeOfmayTLiaXOKCcA/exec?admin=1"
  allow="clipboard-read; clipboard-write"
  loading="eager"
  title="QUẢN TRỊ TRA CỨU THÔNG TIN"
></iframe>

<section id="loading" aria-label="Đang tải trang quản trị">
  <div class="grid-bg"></div>
  <div class="glow-orb o1"></div>
  <div class="glow-orb o2"></div>

  <div class="card">
    <div class="badge"><i></i>ADMIN • Đang khởi động</div>

    <div class="logo-wrap">
      <div class="logo-ring"></div>
      <img class="logo" src="admin-logo-loading.png" alt="Logo quản trị" decoding="async" fetchpriority="high">
    </div>

    <h1>QUẢN TRỊ TRA CỨU THÔNG TIN</h1>
    <div class="admin-mark">Dashboard quản trị</div>
    <div class="sub">Đang mở bảng điều khiển và kết nối dữ liệu quản trị</div>

    <div class="progress"><div class="bar" id="progressBar"></div></div>
    <div class="caption" id="loadingCaption">Đang xác lập phiên quản trị...</div>
    <div class="status-row"><i></i><i></i><i></i></div>
  </div>
</section>

<script>
(() => {
  const t0 = performance.now();
  const frame = document.getElementById("adminFrame");
  const loading = document.getElementById("loading");
  const bar = document.getElementById("progressBar");
  const caption = document.getElementById("loadingCaption");
  const conn = navigator.connection || navigator.mozConnection || navigator.webkitConnection || null;

  if (conn && (conn.saveData || /(^|-)2g$|3g/i.test(conn.effectiveType || ""))) {
    document.body.classList.add("net-lite");
  }

  let progress = 12;
  let done = false;
  const texts = [
    "Đang xác lập phiên quản trị...",
    "Đang kết nối dữ liệu hệ thống...",
    "Đang chuẩn bị Dashboard...",
    "Sắp hoàn tất..."
  ];

  function textFor(v){
    return v < 30 ? texts[0] :
           v < 55 ? texts[1] :
           v < 80 ? texts[2] : texts[3];
  }

  const timer = setInterval(() => {
    if (done) return;
    if (progress < 35) progress += 5;
    else if (progress < 60) progress += 3;
    else if (progress < 82) progress += 2;
    else if (progress < 92) progress += .7;
    progress = Math.min(progress,92);
    bar.style.width = progress + "%";
    caption.textContent = textFor(progress);
  }, 360);

  function finish(){
    if (done) return;
    done = true;
    clearInterval(timer);
    bar.style.width = "100%";
    caption.textContent = "Hoàn tất";
    document.body.classList.add("app-ready");
    setTimeout(() => loading.classList.add("hide"), 190);
  }

  frame.addEventListener("load", () => setTimeout(finish,80), {once:true});
  setTimeout(() => { if (!done) finish(); }, 8000);

  window.__ADMIN_WRAPPER_PERF__ = {
    startedAt:t0,
    network:conn ? (conn.effectiveType || "unknown") : "unknown",
    saveData:!!(conn && conn.saveData)
  };
})();
</script>
</body>
</html>
